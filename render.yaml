# Deploys the NestJS pricing API. The mobile app and the Vercel web app both
# talk to this; all pricing arithmetic lives here, so it has to be reachable
# over HTTPS from a phone on any network, not just the office Wi-Fi.
services:
  - type: web
    name: gcpe-api
    runtime: node
    rootDir: backend/api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    # Every other route is behind the global JWT guard and would answer a probe
    # with 401, which the platform reads as "down".
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # MONGODB_URI is set, so the in-memory fallback never loads. Skip the
      # ~100MB MongoDB binary its postinstall would otherwise download.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # Secret. Paste the Atlas connection string in the Render dashboard —
      # it must not live in the repo.
      - key: MONGODB_URI
        sync: false
      # Without this the code falls back to a hardcoded default that is public
      # in the source, and anyone could mint themselves an admin token.
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_SEPARATE_APPROVER
        value: "false"
      # Where uploaded circular documents are kept. Must point at a mounted
      # disk: without one the filesystem is ephemeral and every uploaded
      # circular is lost on the next restart. The service warns at boot if
      # this is unset in production.
      - key: CIRCULAR_STORE_DIR
        value: /var/data/circulars

    # Uncomment together with a paid plan above. Render does not allow a disk
    # on a free instance, so syncing this blueprint while `plan: free` stands
    # will fail rather than silently ignore it. A round is ~14 documents of a
    # few megabytes, so 1GB holds years of them.
    #
    # disk:
    #   name: circulars
    #   mountPath: /var/data
    #   sizeGB: 1

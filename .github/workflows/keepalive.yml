# Render's free tier puts a service to sleep after 15 minutes without traffic,
# and the next visitor waits roughly 50 seconds while it boots. That wait looks
# exactly like the app being broken, so the first person to open it each morning
# would reasonably report it as down.
#
# Pinging the health endpoint keeps the instance resident. GitHub only bills
# Actions minutes on private repositories, so this costs nothing here.
name: Keep the API awake

on:
  schedule:
    # GitHub's scheduler is best-effort and can drift by several minutes under
    # load, so this runs well inside Render's 15-minute idle window.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 \
            https://gcpe-api.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/body
          echo
          # A 200 that reports the database as down still means the app cannot
          # serve a single real request, so treat it as a failure worth seeing.
          if [ "$code" != "200" ] || ! grep -q '"database":"up"' /tmp/body; then
            echo "::error::API unhealthy (HTTP $code)"
            exit 1
          fi
